<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon projet AR</title>
    <link rel="stylesheet" href="assets/style.css">

    <!-- Bibliothèques nécessaires à la réalité augmentée -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar-nft.js"></script>
</head>
<body>

    <!-- Scène de réalité augmentée -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Image utilisée comme marqueur -->
        <a-nft
            type="nft"
            url="https://leobadureau.github.io/testAR/assets/nft/a"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5">

            <!-- Modèle 3D : remonté sur l'axe vertical -->
            <a-entity
                id="pikachu"
                gltf-model="url(assets/pokemon-pikachu.glb)"
                position="50 220 0"
                rotation="-90 0 0"
                scale="100 100 100">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Message d'information -->
    <div id="message">Initialisation de la réalité augmentée...</div>

    <script src="assets/app.js"></script>
</body>
</html>
