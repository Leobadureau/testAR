<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>AR - Pikachu</title>


  <!-- A-Frame -->


  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


  <!-- AR.js NFT -->


  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Écran de chargement */
    #ar-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      text-align: center;
      padding: 20px;
    }

    #ar-loader h2 {
      font-size: 24px;
    }

    #ar-loader p {
      font-size: 14px;
      color: #ccc;
    }

    #ar-loader.hidden {
      display: none;
    }

    .loader-circle {
      width: 45px;
      height: 45px;
      border: 4px solid #555;
      border-top-color: #ffcc00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>


</head>


<body>


  <!-- Écran d'attente -->


  <div id="ar-loader">
    <div class="loader-circle"></div>
    <h2>Recherche du panneau...</h2>
    <p>Pointez votre caméra vers le panneau jaune.</p>
  </div>


  <!-- Scène AR -->


<a-scene
embedded
vr-mode-ui="enabled: false"
renderer="logarithmicDepthBuffer: true;"
arjs="
trackingMethod: best;
sourceType: webcam;
debugUIEnabled: false;
"

<!-- Reconnaissance du panneau NFT -->
<a-nft
      id="panneau-marker"
      type="nft"
      url="assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

<!-- Pikachu -->
<a-entity
        id="pikachu"
        gltf-model="url(assets/pikachu.glb)"
        position="50 150 0"
        rotation="-90 0 0"
        scale="2 2 2"
      ></a-entity>

</a-nft>

<!-- Caméra -->
<a-entity camera></a-entity>

  </a-scene>


  <script>
    const loader = document.getElementById("ar-loader");
    const marker = document.getElementById("panneau-marker");

    // Le panneau est reconnu
    marker.addEventListener("markerFound", () => {
      console.log("Panneau reconnu !");
      loader.classList.add("hidden");
    });

    // Le panneau n'est plus visible
    marker.addEventListener("markerLost", () => {
      console.log("Panneau perdu !");
      loader.classList.remove("hidden");
    });
  </script>


</body>
</html>
