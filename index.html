<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arjs-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="arjs-loader" id="loader">
    <div id="loader-text">
      Chargement de la reconnaissance...
      <br><br>
      Autorise la caméra et présente ta carte.
    </div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <a-nft
      type="nft"
      url="assets/SAE502"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="nft-marker"
    >

      <a-entity
        gltf-model="url(assets/eddies_nissan_skyline_r34_nfs_underground.glb)"
        scale="0.1 0.1 0.1"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
  const marker = document.querySelector("#nft-marker");
const status = document.querySelector("#status");

marker.addEventListener("markerFound", () => {
  status.innerHTML = "✅ CARTE ALDILÀ DÉTECTÉE";
  status.style.background = "green";
});

marker.addEventListener("markerLost", () => {
  status.innerHTML = "⚠️ CARTE PERDUE";
  status.style.background = "orange";
});

window.addEventListener("arjs-nft-loaded", () => {
  status.innerHTML = "📷 FICHIERS CHARGÉS — SCAN EN COURS";
});

window.addEventListener("error", (e) => {
  status.innerHTML = "❌ ERREUR : " + e.message;
});
  </script>

</body>
</html>
