
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR - Pikachu</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Écran de recherche */
    #ar-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;

      background: rgba(0, 0, 0, 0.25);
      color: white;
      text-align: center;
      padding: 20px;

      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #ar-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #ar-loader h2 {
      font-size: 24px;
      text-shadow: 0 2px 5px black;
    }

    #ar-loader p {
      font-size: 14px;
      color: white;
      text-shadow: 0 2px 5px black;
    }

    .loader-circle {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffcc00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Message de détection */
    #success-message {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;

      padding: 12px 20px;
      border-radius: 30px;

      background: #ffcc00;
      color: #222;
      font-weight: bold;

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }

    #success-message.visible {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>

  <!-- Écran de recherche -->
  <div id="ar-loader">
    <div class="loader-circle"></div>
    <h2>Recherche du panneau...</h2>
    <p>Pointez votre caméra vers le panneau jaune.</p>
  </div>

  <div id="success-message">
    Pikachu est apparu !
  </div>

  <!-- SCÈNE AR -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <!-- MARQUEUR NFT -->
    <a-nft
      id="panneau-marker"
      type="nft"
      url="/testAR/assets/a"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- PIKACHU -->
      <a-entity
        id="pikachu"
        gltf-model="url(assets/pokemon-pikachu.glb)"
        position="50 150 0"
        rotation="-90 0 0"
        scale="2 2 2"
      >
      </a-entity>

    </a-nft>

    <!-- CAMÉRA -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- SCRIPTS -->
  <script>

    const loader = document.getElementById("ar-loader");
    const marker = document.getElementById("panneau-marker");
    const pikachu = document.getElementById("pikachu");
    const successMessage = document.getElementById("success-message");

    // Initialisation de la scène
    document.querySelector("a-scene").addEventListener("loaded", () => {
      console.log("✅ Scène AR chargée !");
    });

    // Pikachu chargé
    pikachu.addEventListener("model-loaded", () => {
      console.log("✅ Pikachu chargé !");
    });

    // Erreur Pikachu
    pikachu.addEventListener("model-error", (event) => {
      console.error("❌ Erreur Pikachu :", event.detail);
    });

    // Panneau détecté
    marker.addEventListener("markerFound", () => {

      console.log("✅ PANNEAU RECONNU !");

      loader.classList.add("hidden");
      successMessage.classList.add("visible");

    });

    // Panneau perdu
    marker.addEventListener("markerLost", () => {

      console.log("❌ PANNEAU PERDU !");

      loader.classList.remove("hidden");
      successMessage.classList.remove("visible");

    });

    console.log("URL du marqueur : /testAR/assets/a");
    console.log("URL du modèle : /testAR/assets/pokemon-pikachu.glb");

  </script>

</body>
</html>
