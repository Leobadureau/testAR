<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon projet AR</title>
    <link rel="stylesheet" href="assets/style.css">

    <!-- Bibliothèques nécessaires à la réalité augmentée -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body>

    <!-- Scène de réalité augmentée -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Image utilisée comme marqueur -->
        <a-nft
            type="nft"
            url="assets/nft/a"
            smooth="true"
            smooth-count="10"
            smooth-tolerance="0.01"
            smooth-threshold="5">

            <!-- Modèle 3D affiché quand le marqueur est reconnu -->
            <a-entity
                gltf-model="url(assets/pokemon-pikachu.glb)"
                position="50 150 0"
                rotation="-90 0 0"
                scale="2 2 2">
            </a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Petit message affiché à l'écran -->
    <div id="message">Chargement de la caméra...</div>

    <script src="assets/app.js"></script>
</body>
</html>
