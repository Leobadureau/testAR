
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALDILÀ — Expérience AR</title>

  <!-- A-FRAME -->
 <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.JS NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      text-align: center;
    }

    #loader-content {
      max-width: 320px;
    }

    #loader-icon {
      font-size: 35px;
      margin-bottom: 20px;
    }

    #loader-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #loader-text {
      font-size: 14px;
      line-height: 1.6;
      color: #ccc;
    }

    .spinner {
      width: 35px;
      height: 35px;
      margin: 20px auto;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- ÉCRAN DE CHARGEMENT -->

  <div id="loader">
    <div id="loader-content">

      <div id="loader-icon">📷</div>

      <div id="loader-title">
        ALDILÀ — Réalité augmentée
      </div>

      <div class="spinner"></div>

      <div id="loader-text">
        Initialisation de la caméra...
      </div>

    </div>
  </div>


  <!-- SCÈNE AR -->

  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled: false"
    renderer="
      logarithmicDepthBuffer: true;
      antialias: true;
      alpha: true;
    "
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <!-- MARQUEUR NFT -->

    <a-nft
      id="nft-marker"
      type="nft"
      url="https://leobadureau.github.io/testAR/assets/SAE502"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- MODÈLE 3D -->

      <a-entity
        gltf-model="url(https://leobadureau.github.io/testAR/assets/eddies_nissan_skyline_r34_nfs_underground.glb)"
        scale="0.1 0.1 0.1"
        position="0 0 0"
        rotation="-90 0 0"
      ></a-entity>

    </a-nft>

    <!-- CAMÉRA -->

    <a-entity camera></a-entity>

  </a-scene>


  <!-- GESTION DU CHARGEMENT -->

  <script>

    const loader = document.querySelector("#loader");
    const loaderTitle = document.querySelector("#loader-title");
    const loaderText = document.querySelector("#loader-text");
    const spinner = document.querySelector(".spinner");

    const marker = document.querySelector("#nft-marker");
    const scene = document.querySelector("#ar-scene");

    let nftLoaded = false;
    let markerDetected = false;
    let loadingError = false;


    // AFFICHER UN MESSAGE

    function showMessage(title, message, showSpinner = true) {

      loader.style.display = "flex";

      loaderTitle.textContent = title;
      loaderText.textContent = message;

      spinner.style.display = showSpinner ? "block" : "none";

    }


    // MASQUER L'ÉCRAN

    function hideLoader() {

      loader.style.display = "none";

    }


    // INITIALISATION DE LA SCÈNE

    scene.addEventListener("loaded", () => {

      console.log("Scène A-Frame initialisée.");

      showMessage(
        "Initialisation terminée",
        "Chargement des fichiers de reconnaissance NFT..."
      );

    });


    // CHARGEMENT NFT TERMINÉ

    window.addEventListener("arjs-nft-loaded", () => {

      nftLoaded = true;

      console.log("Fichiers NFT chargés.");

      if (!loadingError) {

        showMessage(
          "Reconnaissance prête",
          "Présente maintenant ta carte ALDILÀ devant la caméra.",
          false
        );

      }

    });


    // CARTE DÉTECTÉE

    marker.addEventListener("markerFound", () => {

      markerDetected = true;

      console.log("Carte ALDILÀ détectée !");

      hideLoader();

    });


    // CARTE PERDUE

    marker.addEventListener("markerLost", () => {

      markerDetected = false;

      console.log("Carte perdue.");

      if (nftLoaded && !loadingError) {

        showMessage(
          "Carte non détectée",
          "Présente à nouveau ta carte devant la caméra.",
          false
        );

      }

    });


    // ERREURS JAVASCRIPT

    window.addEventListener("error", (event) => {

      console.error("Erreur JavaScript :", event.message);

      // Ne pas traiter les erreurs de chargement de ressources
      // comme des erreurs JavaScript de l'application.
      if (!event.message) return;

      loadingError = true;

      showMessage(
        "Erreur technique",
        "Une erreur est survenue : " + event.message,
        false
      );

    });


    // ERREURS DE PROMESSES

    window.addEventListener("unhandledrejection", (event) => {

      console.error("Erreur de chargement :", event.reason);

      loadingError = true;

      showMessage(
        "Erreur de chargement",
        "Impossible de charger une ressource. Vérifie ta connexion.",
        false
      );

    });


    // SURVEILLANCE DU CHARGEMENT

    setTimeout(() => {

      if (!nftLoaded && !loadingError) {

        console.error(
          "Le chargement NFT dépasse 30 secondes."
        );

        showMessage(
          "Chargement trop long",
          "Les fichiers de reconnaissance ne répondent pas. Vérifie les fichiers NFT et leur compatibilité.",
          false
        );

      }

    }, 30000);


    // DIAGNOSTIC

    console.log("URL des fichiers NFT :");
    console.log(
      "https://leobadureau.github.io/testAR/assets/SAE502"
    );

    console.log("URL du modèle 3D :");
    console.log(
      "https://leobadureau.github.io/testAR/assets/eddies_nissan_skyline_r34_nfs_underground.glb"
    );

  </script>

</body>
</html>
